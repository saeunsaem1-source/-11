<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교실 타이머 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: two panes (timer | memo) split by a draggable rail; stacks top/bottom on phones */
:root {
  --bg: #eef1ec;
  --pane: #fbfcf9;
  --ink: #1d2622;
  --muted: #66736c;
  --line: #d3dad4;
  --accent: #e8590c;
  --accent-ink: #ffffff;
  --soft: #e3e8e2;
  --warn: #d6336c;
  --done: #2f9e44;
  --font-display: "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --pane: #171e1b; --ink: #e9efe9; --muted: #8d9a93; --line: #2a3430;
    --accent: #ff8a3d; --accent-ink: #1a0f06; --soft: #222b27; --warn: #ff6b9a; --done: #69db7c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --pane: #171e1b; --ink: #e9efe9; --muted: #8d9a93; --line: #2a3430;
  --accent: #ff8a3d; --accent-ink: #1a0f06; --soft: #222b27; --warn: #ff6b9a; --done: #69db7c;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  display: flex; flex-direction: column; box-sizing: border-box;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  gap: 12px; overflow: hidden;
}
*, *::before, *::after { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 0.85rem; }
.bar-right { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; }
.seg button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 999px;
  font-size: 0.85rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
}
.seg button[aria-pressed="true"] { background: var(--pane); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.seg svg { width: 15px; height: 15px; }
.ghost {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 6px 12px; font-size: 0.85rem; color: var(--muted);
}
.ghost:hover { color: var(--ink); border-color: var(--muted); }

/* split */
.split { flex: 1; min-height: 0; display: flex; }
.pane {
  background: var(--pane); border: 1px solid var(--line); border-radius: 18px;
  min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
}
#timerPane { flex: 0 0 var(--left, 50%); container-type: inline-size; position: relative; }
#memoPane { flex: 1 1 0; }

.rail {
  flex: 0 0 18px; display: flex; align-items: center; justify-content: center;
  cursor: col-resize; touch-action: none; border-radius: 9px;
}
.rail::before {
  content: ""; width: 4px; height: 56px; border-radius: 4px; background: var(--line);
  transition: background .15s, height .15s;
}
.rail:hover::before, .rail.dragging::before, .rail:focus-visible::before { background: var(--accent); height: 96px; }
.rail:focus-visible { outline: none; }
body.dragging { cursor: col-resize; user-select: none; }
body.dragging.v { cursor: row-resize; }

/* timer */
.timer-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4cqi; padding: 5cqi 6cqi; min-height: 0; }
.label { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.digits {
  font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums;
  font-size: min(24cqi, 34vh); line-height: 0.9; letter-spacing: -0.04em; text-align: center;
  transition: color .2s;
}
.digits .colon { opacity: .35; margin: 0 -0.02em; }
#timerPane.running .digits .colon { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: .1; } }
#timerPane.last .digits { color: var(--warn); }
#timerPane.done .digits { color: var(--done); }
#timerPane.done { animation: flash 1s ease-in-out 6; }
@keyframes flash { 50% { background: color-mix(in srgb, var(--done) 18%, var(--pane)); } }

/* ruler progress */
.ruler { position: relative; height: 14px; border-radius: 7px; background: var(--soft); overflow: hidden; }
.ruler .fill { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--accent); border-radius: 7px; transition: width .25s linear, background .2s; }
#timerPane.last .ruler .fill { background: var(--warn); }
#timerPane.done .ruler .fill { background: var(--done); }
.ruler .ticks { position: absolute; inset: 0; display: flex; justify-content: space-between; pointer-events: none; }
.ruler .ticks i { width: 2px; background: var(--pane); opacity: .55; }
.ruler .ticks i:first-child, .ruler .ticks i:last-child { opacity: 0; }
.endline { text-align: center; color: var(--muted); font-size: clamp(0.85rem, 3.2cqi, 1.3rem); min-height: 1.4em; }
.endline strong { color: var(--ink); font-variant-numeric: tabular-nums; }

/* controls */
.controls { display: flex; flex-direction: column; gap: 10px; padding: 0 6cqi 5cqi; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 0; min-width: 0; }
.chip {
  border: 1px solid var(--line); background: var(--pane); border-radius: 12px;
  padding: 10px 6px; font-weight: 500; font-family: var(--font-display); font-size: 1.05rem;
}
.chip small { font-family: var(--font-body); font-size: 0.75em; color: var(--muted); margin-left: 2px; }
.chip:hover { border-color: var(--accent); }
.minbox { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--pane); flex: 3 1 0; }
.minbox input {
  border: 0; background: transparent; width: 100%; min-width: 0; padding: 10px 4px 10px 12px; text-align: right;
  font-family: var(--font-display); font-size: 1.05rem; font-variant-numeric: tabular-nums;
}
.minbox input:focus { outline: none; }
.minbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.minbox span { padding-right: 6px; color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
.minbox button { border: 0; background: var(--soft); align-self: stretch; padding: 0 14px; font-size: 0.9rem; font-weight: 500; }
.big {
  border: 0; border-radius: 14px; padding: 14px 10px; font-size: 1.1rem; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.big svg { width: 20px; height: 20px; }
#startBtn { background: var(--accent); color: var(--accent-ink); flex: 2 1 0; }
#startBtn:hover { filter: brightness(1.06); }
#resetBtn { background: var(--soft); }
.hint { color: var(--muted); font-size: 0.75rem; text-align: center; }
.hint kbd { font-family: var(--font-display); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-size: 0.95em; }

/* memo */
.memo-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.memo-head .label { margin: 0; }
.tools { display: flex; gap: 6px; align-items: center; }
.tools .ghost { padding: 5px 10px; }
.size-val { font-family: var(--font-display); font-size: 0.85rem; color: var(--muted); min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
#memo {
  flex: 1; border: 0; resize: none; background: transparent; padding: 20px 24px;
  font-size: var(--memo-size, 40px); line-height: 1.45; font-weight: 500; min-height: 0;
}
#memo:focus { outline: none; }
#memo::placeholder { color: var(--muted); opacity: .6; }
#clearBtn.armed { color: var(--warn); border-color: var(--warn); }

/* phone: stack */
@media (max-width: 720px) {
  .split { flex-direction: column; }
  #timerPane { flex-basis: var(--top, 55%); }
  .rail { flex-basis: 18px; cursor: row-resize; }
  .rail::before { width: 56px; height: 4px; }
  .rail:hover::before, .rail.dragging::before, .rail:focus-visible::before { width: 96px; height: 4px; }
  .digits { font-size: min(24cqi, 16vh); }
  .timer-body { gap: 10px; padding: 14px 16px; }
  .controls { padding: 0 16px 14px; }
  .hint { display: none; }
  #memo { padding: 14px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  #timerPane.done, #timerPane.running .digits .colon { animation: none; }
  .ruler .fill { transition: none; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><b>교실 타이머 보드</b><span>타이머 + 칠판 메모</span></div>
  <div class="bar-right">
    <button class="ghost" id="soundBtn" type="button" aria-pressed="true">알림음 켜짐</button>
    <button class="ghost" id="fsBtn" type="button">전체화면</button>
    <div class="seg" role="group" aria-label="화면 모드">
      <button type="button" id="lightBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>라이트
      </button>
      <button type="button" id="darkBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>다크
      </button>
    </div>
  </div>
</header>

<main class="split" id="split">
  <section class="pane" id="timerPane" aria-label="타이머">
    <div class="timer-body">
      <div class="label"><span id="stateLabel">준비</span><span id="totalLabel">7분 타이머</span></div>
      <div class="digits" id="digits" role="timer" aria-live="off">07<span class="colon">:</span>00</div>
      <div class="ruler" aria-hidden="true"><div class="fill" id="fill"></div><div class="ticks" id="ticks"></div></div>
      <div class="endline" id="endline">시작을 누르면 끝나는 시각이 보여요</div>
    </div>
    <div class="controls">
      <div class="row">
        <button class="chip" type="button" data-min="1">1<small>분</small></button>
        <button class="chip" type="button" data-min="3">3<small>분</small></button>
        <button class="chip" type="button" data-min="5">5<small>분</small></button>
        <button class="chip" type="button" data-min="10">10<small>분</small></button>
      </div>
      <form class="row" id="minForm" autocomplete="off">
        <div class="minbox">
          <input id="minInput" type="number" min="0" max="180" step="1" inputmode="numeric" value="7" aria-label="분">
          <span>분</span>
          <input id="secInput" type="number" min="0" max="59" step="1" inputmode="numeric" value="0" aria-label="초">
          <span>초</span>
          <button type="submit">설정</button>
        </div>
        <button class="chip" type="button" id="plusBtn">+1<small>분</small></button>
      </form>
      <div class="row">
        <button class="big" id="startBtn" type="button">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>
          <span id="startText">시작</span>
        </button>
        <button class="big" id="resetBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          초기화
        </button>
      </div>
      <div class="hint"><kbd>Space</kbd> 시작/중지 · <kbd>R</kbd> 초기화 · <kbd>1</kbd> <kbd>3</kbd> <kbd>5</kbd> <kbd>0</kbd> 1·3·5·10분</div>
    </div>
  </section>

  <div class="rail" id="rail" role="separator" tabindex="0" aria-label="타이머와 메모 비율 조절" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" title="드래그해서 비율 조절 · 더블클릭하면 반반"></div>

  <section class="pane" id="memoPane" aria-label="메모">
    <div class="memo-head">
      <div class="label">메모</div>
      <div class="tools">
        <button class="ghost" type="button" id="sizeDown" aria-label="글자 작게">가−</button>
        <span class="size-val" id="sizeVal">40px</span>
        <button class="ghost" type="button" id="sizeUp" aria-label="글자 크게">가+</button>
        <button class="ghost" type="button" id="clearBtn">지우기</button>
      </div>
    </div>
    <textarea id="memo" spellcheck="false" placeholder="학생들에게 보여줄 말을 적어 주세요"></textarea>
  </section>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('ctb:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('ctb:' + k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------- theme ---------- */
  const root = document.documentElement;
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  function paintTheme() {
    const t = root.dataset.theme || (mq.matches ? 'dark' : 'light');
    $('lightBtn').setAttribute('aria-pressed', t === 'light');
    $('darkBtn').setAttribute('aria-pressed', t === 'dark');
  }
  function setTheme(t) { root.dataset.theme = t; store.set('theme', t); paintTheme(); }
  const savedTheme = store.get('theme', null);
  if (savedTheme) root.dataset.theme = savedTheme;
  paintTheme();
  mq.addEventListener && mq.addEventListener('change', paintTheme);
  $('lightBtn').onclick = () => setTheme('light');
  $('darkBtn').onclick = () => setTheme('dark');

  /* ---------- split rail ---------- */
  const split = $('split'), rail = $('rail');
  const narrow = window.matchMedia('(max-width: 720px)');
  let ratio = store.get('ratio', 50), ratioV = store.get('ratioV', 55);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  function applyRatio() {
    split.style.setProperty('--left', ratio + '%');
    split.style.setProperty('--top', ratioV + '%');
    rail.setAttribute('aria-valuenow', Math.round(narrow.matches ? ratioV : ratio));
    rail.setAttribute('aria-orientation', narrow.matches ? 'horizontal' : 'vertical');
  }
  applyRatio();
  narrow.addEventListener && narrow.addEventListener('change', applyRatio);
  function setFromPoint(x, y) {
    const r = split.getBoundingClientRect();
    if (narrow.matches) ratioV = clamp(((y - r.top) / r.height) * 100, 20, 80);
    else ratio = clamp(((x - r.left) / r.width) * 100, 20, 80);
    applyRatio();
  }
  rail.addEventListener('pointerdown', (e) => {
    rail.setPointerCapture(e.pointerId);
    rail.classList.add('dragging');
    document.body.classList.add('dragging');
    document.body.classList.toggle('v', narrow.matches);
    e.preventDefault();
  });
  rail.addEventListener('pointermove', (e) => { if (rail.classList.contains('dragging')) setFromPoint(e.clientX, e.clientY); });
  const endDrag = () => {
    if (!rail.classList.contains('dragging')) return;
    rail.classList.remove('dragging'); document.body.classList.remove('dragging', 'v');
    store.set('ratio', ratio); store.set('ratioV', ratioV);
  };
  rail.addEventListener('pointerup', endDrag);
  rail.addEventListener('pointercancel', endDrag);
  rail.addEventListener('dblclick', () => { ratio = 50; ratioV = 55; applyRatio(); store.set('ratio', ratio); store.set('ratioV', ratioV); });
  rail.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 10 : 2;
    const dec = ['ArrowLeft', 'ArrowUp'].includes(e.key), inc = ['ArrowRight', 'ArrowDown'].includes(e.key);
    if (!dec && !inc) return;
    e.preventDefault(); e.stopPropagation();
    if (narrow.matches) ratioV = clamp(ratioV + (inc ? step : -step), 20, 80);
    else ratio = clamp(ratio + (inc ? step : -step), 20, 80);
    applyRatio(); store.set('ratio', ratio); store.set('ratioV', ratioV);
  });

  /* ---------- memo ---------- */
  const memo = $('memo');
  memo.value = store.get('memo', '쉬는 시간!\n\n종 치면 밖에 나가서 두 줄로 줄 서기\n물 마시고 화장실 다녀오기');
  let saveT;
  memo.addEventListener('input', () => { clearTimeout(saveT); saveT = setTimeout(() => store.set('memo', memo.value), 300); });
  let memoSize = store.get('memoSize', 40);
  function applySize() { memo.style.setProperty('--memo-size', memoSize + 'px'); $('sizeVal').textContent = memoSize + 'px'; store.set('memoSize', memoSize); }
  applySize();
  $('sizeDown').onclick = () => { memoSize = clamp(memoSize - 4, 16, 160); applySize(); };
  $('sizeUp').onclick = () => { memoSize = clamp(memoSize + 4, 16, 160); applySize(); };
  let armT;
  $('clearBtn').onclick = function () {
    if (this.classList.contains('armed')) {
      memo.value = ''; store.set('memo', ''); this.classList.remove('armed'); this.textContent = '지우기'; memo.focus();
    } else {
      this.classList.add('armed'); this.textContent = '한 번 더 누르면 지워져요';
      clearTimeout(armT); armT = setTimeout(() => { this.classList.remove('armed'); this.textContent = '지우기'; }, 3000);
    }
  };

  /* ---------- timer ---------- */
  const pane = $('timerPane');
  let totalMs = 7 * 60000, remainMs = totalMs, endAt = 0, tick = null, wakeLock = null;
  let soundOn = store.get('sound', true);

  function fmt(ms) {
    const s = Math.ceil(ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const pad = (n) => String(n).padStart(2, '0');
    const c = '<span class="colon">:</span>';
    return h ? h + c + pad(m) + c + pad(sec) : pad(m) + c + pad(sec);
  }
  function minLabel(ms) {
    const s = Math.round(ms / 1000), m = Math.floor(s / 60), sec = s % 60;
    return (m ? m + '분' : '') + (sec ? (m ? ' ' : '') + sec + '초' : '') || '0초';
  }
  function drawTicks() {
    const mins = Math.round(totalMs / 60000);
    const n = mins >= 2 && mins <= 20 ? mins + 1 : 0;
    $('ticks').innerHTML = '<i></i>'.repeat(n);
  }
  function clockText(d) {
    const h = d.getHours(), m = d.getMinutes();
    return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + String(m).padStart(2, '0');
  }
  function render() {
    $('digits').innerHTML = fmt(remainMs);
    $('fill').style.width = (totalMs ? (remainMs / totalMs) * 100 : 0) + '%';
    const running = !!tick, done = remainMs <= 0;
    pane.classList.toggle('running', running);
    pane.classList.toggle('last', !done && remainMs <= 60000 && totalMs > 60000);
    $('playIcon').hidden = running; $('pauseIcon').hidden = !running;
    $('startText').textContent = running ? '중지' : (remainMs < totalMs && !done ? '이어서' : '시작');
    $('stateLabel').textContent = done ? '끝!' : running ? '진행 중' : (remainMs < totalMs ? '멈춤' : '준비');
    $('totalLabel').textContent = minLabel(totalMs) + ' 타이머';
    if (done) $('endline').innerHTML = '<strong>시간 끝!</strong> 자리로 돌아오세요';
    else if (running) $('endline').innerHTML = '<strong>' + clockText(new Date(endAt)) + '</strong>에 끝나요';
    else if (remainMs < totalMs) $('endline').textContent = minLabel(Math.ceil(remainMs / 1000) * 1000) + ' 남았어요';
    else $('endline').textContent = '시작을 누르면 끝나는 시각이 보여요';
    document.title = running || (remainMs < totalMs && !done) ? fmt(remainMs).replace(/<[^>]+>/g, '') + ' · 교실 타이머 보드' : '교실 타이머 보드';
  }
  function loop() {
    remainMs = Math.max(0, endAt - Date.now());
    if (remainMs <= 0) { stop(); finish(); }
    render();
  }
  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
      if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) { wakeLock = null; }
  }
  function start() {
    if (remainMs <= 0) remainMs = totalMs;
    pane.classList.remove('done');
    unlockAudio();
    endAt = Date.now() + remainMs;
    tick = setInterval(loop, 200);
    keepAwake(true); render();
  }
  function stop() { clearInterval(tick); tick = null; keepAwake(false); }
  function pause() { if (!tick) return; remainMs = Math.max(0, endAt - Date.now()); stop(); render(); }
  function toggle() { tick ? pause() : start(); }
  function reset() { stop(); remainMs = totalMs; pane.classList.remove('done'); render(); }
  function syncInputs() {
    const s = Math.round(totalMs / 1000);
    $('minInput').value = Math.floor(s / 60);
    $('secInput').value = s % 60;
  }
  function setSeconds(sec, autoStart) {
    if (!(sec > 0)) return;
    sec = Math.min(Math.round(sec), 180 * 60);
    stop(); totalMs = sec * 1000; remainMs = totalMs;
    syncInputs();
    pane.classList.remove('done'); drawTicks(); render();
    if (autoStart) start();
  }
  function setMinutes(min, autoStart) { setSeconds(min * 60, autoStart); }
  function finish() { remainMs = 0; pane.classList.remove('done'); void pane.offsetWidth; pane.classList.add('done'); chime(); }

  /* sound */
  let ctx = null;
  function unlockAudio() {
    try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) {}
  }
  function chime() {
    if (!soundOn || !ctx) return;
    const notes = [880, 1175, 1568, 0, 880, 1175, 1568];
    notes.forEach((f, i) => {
      if (!f) return;
      const t = ctx.currentTime + i * 0.22;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.55);
    });
  }
  function paintSound() { $('soundBtn').textContent = soundOn ? '알림음 켜짐' : '알림음 꺼짐'; $('soundBtn').setAttribute('aria-pressed', soundOn); }
  paintSound();
  $('soundBtn').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); paintSound(); if (soundOn) { unlockAudio(); } };

  /* fullscreen */
  $('fsBtn').onclick = async () => {
    try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) { $('fsBtn').textContent = '전체화면 불가'; }
  };
  document.addEventListener('fullscreenchange', () => { $('fsBtn').textContent = document.fullscreenElement ? '전체화면 끄기' : '전체화면'; });

  /* wiring */
  document.querySelectorAll('[data-min]').forEach((b) => b.addEventListener('click', () => { unlockAudio(); setMinutes(+b.dataset.min, false); }));
  $('minForm').addEventListener('submit', (e) => {
    e.preventDefault(); unlockAudio();
    const m = Math.max(0, parseInt($('minInput').value, 10) || 0);
    const s = Math.max(0, parseInt($('secInput').value, 10) || 0);
    setSeconds(m * 60 + s, false);
    document.activeElement && document.activeElement.blur();
  });
  ['minInput', 'secInput'].forEach((id) => $(id).addEventListener('focus', (e) => e.target.select()));
  $('plusBtn').onclick = () => {
    totalMs += 60000; remainMs += 60000;
    if (tick) endAt += 60000;
    pane.classList.remove('done');
    syncInputs();
    drawTicks(); render();
  };
  $('startBtn').onclick = toggle;
  $('resetBtn').onclick = reset;
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'textarea' || tag === 'input' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'Space') { e.preventDefault(); if (tag === 'button') e.target.blur(); toggle(); }
    else if (e.key === 'r' || e.key === 'R' || e.key === 'ㄱ') reset();
    else if (e.key === '1') setMinutes(1);
    else if (e.key === '3') setMinutes(3);
    else if (e.key === '5') setMinutes(5);
    else if (e.key === '0') setMinutes(10);
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && tick) { keepAwake(true); loop(); } });

  drawTicks(); render();
})();
</script>

</body>
</html>
